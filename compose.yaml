name: discord-clone
services:
  mariadb:
    image: mariadb:lts-ubi9
    container_name: discord-clone-mariadb
    environment:
      - MARIADB_USER=${DATABASE_USER}
      - MARIADB_PASSWORD=${DATABASE_PASSWORD}
      - MARIADB_DATABASE=${DATABASE_NAME}
      - MARIADB_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}

    ports:
      - ${DATABASE_PORT}:3306
    restart: always

  adminer:
    container_name: discord-clone-adminer
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - mariadb

networks:
  default:
    name: discord-clone-network
    driver: bridge